name: moa-market-local
services:
  db-dev:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${DEV_ADMIN_PASSWORD:?Set DEV_ADMIN_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB: marketplace_dev
      APP_USER: marketplace_dev
      APP_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-15432}:5432"
    volumes:
      - dev-data:/var/lib/postgresql
      - ./infra/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-init-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${APP_USER}" -d "$${APP_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
  db-test:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${TEST_ADMIN_PASSWORD:?Set TEST_ADMIN_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB: marketplace_test
      APP_USER: marketplace_test
      APP_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-15433}:5432"
    volumes:
      - test-data:/var/lib/postgresql
      - ./infra/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-init-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${APP_USER}" -d "$${APP_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dev-data:
  test-data:
