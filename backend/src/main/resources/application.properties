management.endpoints.web.exposure.include=health
# No management authentication/network is configured yet: opt in only health.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.jmx.exposure.exclude=*
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
logging.pattern.level=%5p [requestId=%X{requestId:-}]
spring.sql.init.mode=never
spring.flyway.clean-disabled=true

# The db profile explicitly clears these exclusions; all profiles retain health rules.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

# Web processes do not poll jobs unless explicitly enabled.
marketplace.worker.enabled=false
server.address=${SERVER_ADDRESS:127.0.0.1}
marketplace.runtime.mode=${MARKETPLACE_RUNTIME_MODE:local-full}
marketplace.runtime.access=${MARKETPLACE_RUNTIME_ACCESS:}
marketplace.runtime.public-origin=${MARKETPLACE_RUNTIME_PUBLIC_ORIGIN:}
marketplace.runtime.internal-api=${MARKETPLACE_RUNTIME_INTERNAL_API:false}
